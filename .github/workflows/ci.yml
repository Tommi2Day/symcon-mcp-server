name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage
        run: npx vitest run --coverage

  # ─── Integration Tests ────────────────────────────────────────────────────────
  integration:
    name: Integration Tests (Symcon Docker)
    runs-on: ubuntu-latest
    # Only run on main branch and PRs targeting main
    if: github.event_name == 'push' || github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Symcon via Docker Compose
        run: docker compose -f docker/docker-compose.test.yml up -d --wait

      - name: Run integration tests
        env:
          SYMCON_TEST_URL: http://127.0.0.1:3777/api/
        run: npm run test:integration

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Tommi2Day/symcon-mcp-server

      - name: Stop Symcon
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down --volumes

  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: symcon-mcp-server:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No Symcon is attached here, so /health answers 503 (degraded) and the
      # Docker health status cannot turn healthy. What this checks is that the
      # server is reachable on 127.0.0.1 inside the container, which is the
      # address the HEALTHCHECK uses (localhost may resolve to ::1).
      - name: Smoke test (server reachable inside the container)
        run: |
          docker run -d --name smoke -e MCP_AUTH_TOKEN=ci-smoke-token symcon-mcp-server:scan
          for i in $(seq 1 20); do
            if docker exec smoke wget -S -O /dev/null http://127.0.0.1:4096/health 2>&1 | grep -qE 'HTTP/[0-9.]+ (200|503)'; then
              echo "server reachable"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      # Pinned to the commit of v0.36.0
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: symcon-mcp-server:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
