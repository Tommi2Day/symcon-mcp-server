name: Docker Hub Description

# Pushes DOCKERHUB.md (a compact version of README.md) and the short description
# to Docker Hub. Runs when DOCKERHUB.md changes on main, or manually.
on:
  push:
    branches: [main]
    paths:
      - DOCKERHUB.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

jobs:
  update-description:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Requires a Docker Hub access token with Read, Write, Delete scope.
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: tommi2day/symcon-mcp-server
          short-description: "Connects AI assistants to IP-Symcon via the Model Context Protocol (MCP)."
          readme-filepath: ./DOCKERHUB.md
