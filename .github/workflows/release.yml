name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (e.g. 1.2.3)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: tommi2day/symcon-mcp-server
  GHCR_IMAGE: ghcr.io/tommi2day/symcon-mcp-server

jobs:
  bump-version:
    name: Bump version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update package.json and openapi.yaml
        run: |
          npm version "${{ inputs.tag }}" --no-git-tag-version

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json openapi.yaml
          git commit -m "chore: bump version to ${{ inputs.tag }}"
          git push

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    needs: [bump-version]
    if: always() && !failure() && !cancelled()

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Coverage
        run: npx vitest run --coverage

      - name: Test
        run: npm test

      - name: Start Symcon via Docker Compose
        run: docker compose -f docker/docker-compose.test.yml up -d --wait

      - name: Run Integration Tests
        env:
          SYMCON_TEST_URL: http://127.0.0.1:3777/api/
        run: npm run test:integration

      - name: Stop Symcon
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down --volumes

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Tommi2Day/symcon-mcp-server

  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: lint-and-test
    # bump-version is skipped on tag pushes; without always() GitHub would skip
    # this job too because a transitive dependency was skipped.
    if: always() && needs.lint-and-test.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            # git tag or release → :1.2.3  :1.2  :1  :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            # manual dispatch → entered tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # always: :sha-<short>
            type=sha,format=short

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: symcon-mcp-server:scan
          cache-from: type=gha

      # Pinned to the commit of v0.36.0. A failing scan stops the release
      # before anything is pushed.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: symcon-mcp-server:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GitHub has no API to change a package's visibility: a new ghcr.io package starts private and is made public once
      # (profile -> Packages -> symcon-mcp-server -> Package settings -> Change visibility). This step fails until that is done.
      - name: Verify the GHCR image is public
        run: |
          repo="${GHCR_IMAGE#ghcr.io/}"
          tag=$(echo "${{ steps.meta.outputs.version }}" | head -n1)
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${repo}/manifests/${tag}")
          if [ "$code" != "200" ]; then
            echo "::error::${GHCR_IMAGE}:${tag} is not publicly pullable (HTTP ${code}). Make the package public: https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/symcon-mcp-server/settings"
            exit 1
          fi
          echo "${GHCR_IMAGE}:${tag} is public"

      - name: Job summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Container image"
            echo
            printf 'Digest: `%s`\n\n' "$DIGEST"
            echo "| Registry | Reference |"
            echo "| --- | --- |"
            while read -r ref; do
              [ -n "$ref" ] || continue
              case "$ref" in ghcr.io/*) reg="GitHub Container Registry" ;; *) reg="Docker Hub" ;; esac
              printf '| %s | `%s` |\n' "$reg" "$ref"
            done <<< "$TAGS"
            echo
            echo "GHCR package is public (verified with an anonymous pull): https://github.com/${GITHUB_REPOSITORY_OWNER}?tab=packages&repo_name=${GITHUB_REPOSITORY#*/}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: docker
    if: always() && needs.docker.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
